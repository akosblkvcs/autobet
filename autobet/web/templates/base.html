<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}autobet{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">

<header class="bar">
  <span class="brand">autobet</span>
  {% if session is defined and session %}
  <nav>
    <a href="/">dashboard</a>
    <a href="/tips">tips</a>
    {% if session.user.is_admin %}<a href="/admin">admin</a>{% endif %}
  </nav>
  <span class="who quiet">{{ session.user.email or session.user.subject }}</span>
  {% endif %}
</header>

<main>{% block body %}{% endblock %}</main>
