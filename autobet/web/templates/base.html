<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}autobet{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">

<header class="bar">
  <span class="brand">autobet</span>
  {% if session is defined and session %}
  <nav>
    <a href="/">dashboard</a>
    <a href="/bets">bets</a>
    <a href="/events">events</a>
    <a href="/settings">settings</a>
    <a href="/account">account</a>
    {% if session.user.is_admin %}<a href="/admin/bets">all bets</a>
    <a href="/admin">admin</a>{% endif %}
  </nav>
  <span class="who quiet">{{ session.user.display }}</span>
  {% endif %}
</header>

<main>{% block body %}{% endblock %}</main>
