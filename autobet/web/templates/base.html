<!doctype html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}autobet{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">

<header class="bar">
  <span class="brand">autobet</span>

  {% endif %}
</header>

<main>{% block body %}{% endblock %}</main>
