name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  release:
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUMP: ${{ inputs.bump }}
    steps:
      - name: Create release
        run: |
          current=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // "v0.0.0" | ltrimstr("v")')
          major=$(echo "$current" | cut -d. -f1)
          minor=$(echo "$current" | cut -d. -f2)
          patch=$(echo "$current" | cut -d. -f3)

          case "$BUMP" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((${patch:-0} + 1))" ;;
          esac

          gh release create "v$next" --target "${{ github.sha }}" --generate-notes
