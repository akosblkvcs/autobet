[project]
name = "autobet"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "telethon>=1.44",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "structlog>=26.1",
  "fastapi>=0.141",
  "uvicorn[standard]>=0.52",
  "asyncpg>=0.31",
  "anthropic>=1.4",
  "jinja2>=3.1",
  "websockets>=17.1",
  "httpx2>=2.12",
  "humanize>=4.16.0",
  "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
  "ruff>=0.16",
  "mypy>=2.3",
  "asyncpg-stubs>=0.31",
]

[tool.uv]
package = false

[tool.mypy]
strict = true
files = ["autobet"]

[[tool.mypy.overrides]]
module = ["telethon.*"]
ignore_missing_imports = true

[tool.pyright]
typeCheckingMode = "strict"
include = ["autobet"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 90
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "D", "A", "C4", "PL"]
ignore = ["D100", "D104", "D106"]

[tool.ruff.lint.pydocstyle]
convention = "google"
