[project]
name = "autobet"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "telethon>=1.41",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "structlog>=25.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "asyncpg>=0.31.0",
  "anthropic>=1.0",
  "jinja2>=3.1",
]

[dependency-groups]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.14",
  "asyncpg-stubs>=0.31.3",
]

[tool.uv]
package = false

[tool.mypy]
strict = true
files = ["autobet"]

[[tool.mypy.overrides]]
module = ["telethon.*"]
ignore_missing_imports = true

[tool.pyright]
typeCheckingMode = "strict"
include = ["autobet"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 90
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "D", "A", "C4", "PL"]
ignore = ["D100", "D104", "D106"]

[tool.ruff.lint.pydocstyle]
convention = "google"
